apiVersion: v1
kind: Service
metadata:
  name: {{ include "roomer.web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roomer.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "roomer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
