name: Checks

on:
  # Direct pushes to develop, not just PRs. develop is pushed to directly as a
  # matter of course here, and with only a pull_request trigger those commits
  # got no build, lint or test run at all — a batch of them accumulated
  # unverified and the first CI to see them would have been the develop->main
  # release PR, well after the fact.
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Build, lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roomer_test
          POSTGRES_PASSWORD: roomer_test
          POSTGRES_DB: roomer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U roomer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # S3-compatible endpoint for the S3 file-storage integration tests.
      s3:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: roomer-test
        ports: ['9090:9090']
    env:
      DATABASE_URL: postgresql://roomer_test:roomer_test@localhost:5432/roomer_test
      TEST_DATABASE_URL: postgresql://roomer_test:roomer_test@localhost:5432/roomer_test
      S3_TEST_ENDPOINT: http://localhost:9090
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @roomer/api exec prisma generate

      - name: Migrate test database
        run: pnpm --filter @roomer/api exec prisma migrate deploy

      - name: Build, lint and test
        run: pnpm turbo build lint test

      - name: Wait for the S3 mock
        run: timeout 60 sh -c 'until curl -sf http://localhost:9090/roomer-test >/dev/null; do sleep 2; done'

      - name: Integration tests (PostgreSQL concurrency, S3 storage)
        run: pnpm --filter @roomer/api test:integration

      - name: Public proxy smoke test
        run: bash scripts/test-proxy.sh

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Template errors otherwise only surface at `helm upgrade` time, against
      # a live release. Helm ships on the ubuntu-latest runner image.
      - name: Lint and render
        run: |
          set -euo pipefail
          required="--set secrets.sessionSecret=$(openssl rand -hex 32) --set secrets.encryptionKey=$(openssl rand -hex 32)"
          helm lint charts/roomer --strict $required
          while read -r name args; do
            echo "::group::render: $name"
            helm template ci charts/roomer $required $args > /dev/null
            echo "::endgroup::"
          done <<'EOF'
          defaults
          external-db --set postgresql.enabled=false --set secrets.databaseUrl=postgresql://u:p@db:5432/roomer
          no-persistence --set postgresql.primary.persistence.enabled=false
          overrides --set fullnameOverride=custom --set ingress.enabled=true
          s3-storage --set storage.backend=s3 --set storage.s3.bucket=roomer --set storage.s3.endpoint=http://minio:9000 --set secrets.s3AccessKeyId=a --set secrets.s3SecretAccessKey=b --set persistence.enabled=false
          EOF
