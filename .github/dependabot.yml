# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm" # This covers npm, yarn, and pnpm
    directory: "/"           # Location of your package.json and pnpm-lock.yaml
    schedule:
      interval: "weekly"     # Options: daily, weekly, monthly
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - "*"

  # Base images (node:24-alpine, nginx:1.27-alpine) were previously untracked —
  # Dependabot only scanned package.json/pnpm-lock.yaml, so a disclosed CVE in
  # either base image would never surface as an alert or update PR.
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"

  # CI Actions (actions/checkout, docker/build-push-action, etc.) were also
  # untracked — a disclosed vulnerability in a pinned Action version would
  # never surface either.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
