server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Resolve the real client IP when Roomer is itself fronted by another proxy
    # (a Kubernetes ingress, cloud load balancer, or CDN). The entrypoint writes
    # one `set_real_ip_from` line per entry in TRUSTED_PROXY_CIDRS; the file is
    # empty by default, which is correct when clients reach this nginx directly.
    # With no trusted upstream, $remote_addr stays the socket peer and any
    # client-supplied X-Forwarded-For is ignored outright.
    include /etc/nginx/snippets/realip.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Proxy API requests to the API service.
    # API_URL is substituted at container startup via envsubst.
    location /api/ {
        proxy_pass ${API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append ($proxy_add_x_forwarded_for). Appending
        # prefixes whatever the client sent, and the API resolves request.ip by
        # walking that chain from the right past every address it trusts — so a
        # client could pad the header with a trusted-looking private address and
        # push request.ip to any value it liked, minting a fresh rate-limit
        # bucket per request and forging the IP on every audit-log row. Sending
        # exactly one entry, always written here from $remote_addr (itself
        # resolved via the realip config above), leaves nothing client-supplied
        # in the header for the API to walk into.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward cookies (required for session auth)
        proxy_pass_header Set-Cookie;

        # Increase timeouts for slow upload requests (floor plan images)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 25m;
    }

    # Cache aggressively hashed assets (Vite adds content hashes to filenames)
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
